# Camera calibration experiment settings
# Usage: ./build/exp_calib_camera exps/exp_calib_camera/config.yaml

# General
output_dir: "exp_calib_camera_output" # Results are saved here
save_samples: true                    # Save sample renders and overlays
num_views: 80                         # Calibration views per camera
seed: 42                              # Random seed (poses and image noise)

# Refine the detected corners to sub-pixel accuracy with cv::cornerSubPix, per
# target type. It reduces the corner error of the checkerboard (0.16 px to
# 0.07 px) and ChArUco board (0.38 px to 0.25 px) in simulation, and increases
# the error of the AprilGrid corners (0.09 px to 0.3 px), which are already
# sub-pixel accurate, so it is off for the AprilGrid.
refine_corners:
  aprilgrid: false
  checkerboard: true
  charuco: true

# Calibration targets to evaluate. All are calibrated with the library
# detectors and CalibCamera.
# - aprilgrid_kaess: plain AprilGrid, ethz_apriltag (AprilTag 1) detector
# - aprilgrid_olsen: plain AprilGrid, apriltag (AprilTag 3) detector
# - checkerboard: needs the whole board in the image, so only poses where the
#   whole board is visible are used
# - charuco: ChArUco board, the board can be partially visible
targets: ["aprilgrid_kaess", "aprilgrid_olsen", "checkerboard", "charuco"]

# Initial intrinsic guesses to calibrate from, for the same detections
# - default: a 90 deg camera without distortion (the calibrator's default)
# - near_truth: ground truth with the focal lengths (+10 %, -8 %) and the
#   principal point (+8, -6 px) perturbed, and no distortion
initial_guesses: ["default", "near_truth"]

# Ground truth camera. The principal point is offset from the image center and
# fy differs from fx, so that those parameters are not trivially recovered.
camera:
  resolution: [752, 480]
  cx_offset: 4.0   # [px]
  cy_offset: -3.0  # [px]
  fy_ratio: 1.004  # fy / fx
  ucm_xi: 0.9      # xi of the UnifiedCameraModel cameras

# Camera models to calibrate every simulated camera with. Every dataset is
# calibrated with every model, also the models that did not render it, to see
# which model fits which kind of lens and field of view best.
fit_models: ["BrownConrady4", "KannalaBrandt4", "UnifiedCameraModel"]

# Horizontal fields of view to test [deg]
fovs: [90, 120, 160, 180, 200, 220]

# Distortion levels per camera model
# - BrownConrady4: pinhole with radial-tangential distortion, k1 and k2 are
#   given as the radial distortion at the horizontal image edge, as a fraction
#   of the undistorted radius, so the levels are comparable across FOVs
# - UnifiedCameraModel: sphere projection (xi from `camera.ucm_xi`) with
#   radial-tangential distortion, k1 and k2 are given like for BrownConrady4,
#   relative to the normalized radius at the horizontal image edge
# - KannalaBrandt4: equidistant fisheye, k1..k4 as is
models:
  BrownConrady4:
    none:
      radial_edge: 0.0
      radial2_edge: 0.0
      tangential: [0.0, 0.0]
    mild:
      radial_edge: -0.03
      radial2_edge: 0.0
      tangential: [0.001, -0.001]
    strong:
      radial_edge: -0.12
      radial2_edge: 0.03
      tangential: [0.003, -0.002]
  UnifiedCameraModel:
    none:
      radial_edge: 0.0
      radial2_edge: 0.0
      tangential: [0.0, 0.0]
    mild:
      radial_edge: -0.03
      radial2_edge: 0.0
      tangential: [0.001, -0.001]
    strong:
      radial_edge: -0.12
      radial2_edge: 0.03
      tangential: [0.003, -0.002]
  KannalaBrandt4:
    none:
      k: [0.0, 0.0, 0.0, 0.0]
    mild:
      k: [-0.005, 0.001, 0.0, 0.0]
    strong:
      k: [-0.03, 0.010, -0.002, 0.0002]

# Camera pose sampling. The board center is placed at a random image location
# so that the board is seen across the entire image.
poses:
  max_tilt: 60.0   # Max angle between board normal and camera position [deg]
  max_theta: 85.0  # Ignore corners further than this off the optical axis [deg]
  # Same, when calibrating lenses with a field of view above 180 deg with a
  # model that supports rays 90 deg or more off the optical axis (not
  # BrownConrady4, which keeps `max_theta`)
  max_theta_wide: 105.0
  dist_range:      # Distance to board center [m], by horizontal FOV
    "90":  [0.5, 1.5]
    "120": [0.4, 1.2]
    "160": [0.3, 0.8]
    "180": [0.25, 0.6]
    "200": [0.2, 0.5]
    "220": [0.2, 0.45]

# Image rendering
render:
  supersample: 2
  margin: 0.1
  blur_sigma: 0.8
  noise_sigma: 2.0
